<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#f6eecf" stop-opacity="0.8"/><stop offset="1" stop-color="#f6eecf" stop-opacity="0"/></radialGradient>
    <filter id="b1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- 宣纸底 -->
  <rect width="800" height="260" fill="#f5f0e6"/>
  <ellipse cx="180" cy="60" rx="140" ry="60" fill="#c9b88a" opacity="0.05" filter="url(#b4)"/>
  <ellipse cx="620" cy="200" rx="160" ry="50" fill="#c9b88a" opacity="0.05" filter="url(#b4)"/>
  <ellipse cx="420" cy="130" rx="180" ry="70" fill="#c9b88a" opacity="0.04" filter="url(#b4)"/>

  <!-- 明月 -->
  <circle cx="690" cy="52" r="42" fill="url(#moonGlow)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="52" r="24" fill="#efe6c8" stroke="#d8cfae" stroke-width="1"/>

  <!-- 月前薄云 -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="-40 0;120 0;-40 0" dur="38s" repeatCount="indefinite"/>
    <ellipse cx="660" cy="60" rx="70" ry="9" fill="#ffffff" opacity="0.55" filter="url(#b4)"/>
    <ellipse cx="740" cy="70" rx="60" ry="7" fill="#ffffff" opacity="0.45" filter="url(#b4)"/>
  </g>

  <!-- 远山 -->
  <path d="M0,168 C60,120 110,150 170,122 C230,96 270,140 330,118 C390,96 430,134 500,112 C560,92 620,138 690,116 C730,104 770,124 800,112 L800,195 L0,195 Z" fill="#33333d" opacity="0.16" filter="url(#b3)"/>
  <!-- 中山 -->
  <path d="M0,200 C70,160 130,184 200,156 C270,130 330,176 410,150 C480,128 540,170 620,150 C690,134 750,164 800,150 L800,222 L0,222 Z" fill="#2e2e38" opacity="0.34" filter="url(#b2)"/>
  <!-- 近丘 -->
  <path d="M520,222 C580,192 650,208 720,188 C760,177 785,192 800,186 L800,242 L520,242 Z" fill="#29292f" opacity="0.55" filter="url(#b1)"/>

  <!-- 山间小亭 -->
  <g transform="translate(645,197)" fill="#2b2b33" opacity="0.85">
    <path d="M-9,0 Q0,-8 9,0 L7,0.8 L-7,0.8 Z"/>
    <rect x="-0.8" y="-10.5" width="1.6" height="3"/>
    <rect x="-5.5" y="0.8" width="1.4" height="6.5"/>
    <rect x="4.1" y="0.8" width="1.4" height="6.5"/>
    <path d="M-5.5,4.5 h11 v1.1 h-11 z" opacity="0.75"/>
  </g>

  <!-- 云雾上带 -->
  <g opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="158" rx="150" ry="18" fill="#ffffff" opacity="0.7" filter="url(#b4)"/>
    <ellipse cx="380" cy="150" rx="170" ry="16" fill="#ffffff" opacity="0.55" filter="url(#b4)"/>
    <ellipse cx="600" cy="160" rx="140" ry="20" fill="#ffffff" opacity="0.65" filter="url(#b4)"/>
  </g>
  <!-- 云雾下带 -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;-90 0;0 0" dur="31s" repeatCount="indefinite"/>
    <ellipse cx="240" cy="182" rx="160" ry="16" fill="#ffffff" opacity="0.6" filter="url(#b4)"/>
    <ellipse cx="500" cy="190" rx="180" ry="14" fill="#ffffff" opacity="0.5" filter="url(#b4)"/>
    <ellipse cx="700" cy="184" rx="120" ry="15" fill="#ffffff" opacity="0.6" filter="url(#b4)"/>
  </g>

  <!-- 水面墨痕 -->
  <g stroke="#2e2e38" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#b1)">
    <path d="M70,196 q45,-4 95,0" opacity="0.22"/>
    <path d="M180,208 q55,-4 110,0" opacity="0.16"/>
    <path d="M300,198 q40,-3 80,0" opacity="0.24"/>
    <path d="M660,204 q50,-4 100,0" opacity="0.2"/>
    <path d="M120,212 q60,-4 120,0" opacity="0.14"/>
  </g>

  <!-- 孤舟渔翁 -->
  <g transform="translate(575,192)">
    <animateTransform attributeName="transform" type="translate" values="575 192;575 188;575 192" dur="5.5s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="0;1.6;0;-1.2;0" dur="7.5s" repeatCount="indefinite" additive="sum"/>
    <!-- 涟漪 -->
    <ellipse cx="0" cy="18" rx="8" ry="2" fill="none" stroke="#2e2e38" stroke-width="1" opacity="0.5">
      <animate attributeName="rx" values="8;30" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="2;5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="18" rx="8" ry="2" fill="none" stroke="#2e2e38" stroke-width="1" opacity="0.5">
      <animate attributeName="rx" values="8;30" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="2;5" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 船身 -->
    <path d="M-40,0 Q0,12 40,0 L32,-7 L-32,-7 Z" fill="#2b2b33"/>
    <!-- 渔翁 -->
    <path d="M-16,-14 L-5,-14 L-10.5,-20 Z" fill="#2b2b33"/>
    <path d="M-15,-14 q-3,8 0,13 h9 q3,-7 0,-13 z" fill="#2b2b33"/>
    <!-- 钓竿与钓线 -->
    <line x1="-4" y1="-16" x2="20" y2="-40" stroke="#2b2b33" stroke-width="1" opacity="0.85"/>
    <line x1="20" y1="-40" x2="20" y2="14" stroke="#2b2b33" stroke-width="0.6" opacity="0.45"/>
  </g>

  <!-- 湖岸小路 -->
  <path d="M0,224 C140,219 300,227 460,222 C610,218 710,225 800,221 L800,260 L0,260 Z" fill="#ece4d0"/>
  <path d="M0,224 C140,219 300,227 460,222 C610,218 710,225 800,221" fill="none" stroke="#2b2b33" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <path d="M0,231 C140,226 300,233 460,229 C610,225 710,231 800,228" fill="none" stroke="#2b2b33" stroke-width="1" opacity="0.18" stroke-linecap="round"/>
  <g fill="#2b2b33">
    <ellipse cx="150" cy="243" rx="5" ry="2.4" opacity="0.3"/>
    <ellipse cx="472" cy="249" rx="6" ry="2.6" opacity="0.25"/>
    <ellipse cx="702" cy="240" rx="4" ry="2" opacity="0.32"/>
  </g>
  <g stroke="#2b2b33" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M92,227 q-2,-7 -6,-10 M92,227 q2,-7 6,-9 M92,227 q0,-8 1,-12"/>
    <path d="M352,230 q-2,-7 -6,-10 M352,230 q2,-6 6,-8 M352,230 q0,-8 1,-11"/>
    <path d="M622,225 q-2,-6 -5,-9 M622,225 q2,-6 5,-8"/>
    <path d="M762,227 q-2,-7 -6,-10 M762,227 q2,-7 6,-9"/>
  </g>

  <!-- 鹈鹕骑行 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-130 222;910 222" dur="24s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.5s" repeatCount="indefinite"/>
      <!-- 后轮 -->
      <g>
        <circle cx="-22" cy="10" r="12" fill="none" stroke="#2b2b33" stroke-width="1.8"/>
        <g stroke="#2b2b33" stroke-width="0.8" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" values="0 -22 10;360 -22 10" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-32.5" y1="10" x2="-11.5" y2="10"/>
          <line x1="-27" y1="1.5" x2="-17" y2="18.5"/>
          <line x1="-17" y1="1.5" x2="-27" y2="18.5"/>
        </g>
      </g>
      <!-- 前轮 -->
      <g>
        <circle cx="22" cy="10" r="12" fill="none" stroke="#2b2b33" stroke-width="1.8"/>
        <g stroke="#2b2b33" stroke-width="0.8" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" values="0 22 10;360 22 10" dur="0.8s" repeatCount="indefinite"/>
          <line x1="11.5" y1="10" x2="32.5" y2="10"/>
          <line x1="17" y1="1.5" x2="27" y2="18.5"/>
          <line x1="27" y1="1.5" x2="17" y2="18.5"/>
        </g>
      </g>
      <!-- 远腿（踩踏） -->
      <path fill="none" stroke="#2b2b33" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" d="M-4,-16 L3,-6 L0,15.5 L4,16">
        <animate attributeName="d" values="M-4,-16 L3,-6 L0,15.5 L4,16;M-4,-16 L1,-7 L-5.5,10 L-1,10.5;M-4,-16 L2,-8 L0,4.5 L4,5;M-4,-16 L2,-7 L5.5,10 L9.5,10.5;M-4,-16 L3,-6 L0,15.5 L4,16" keyTimes="0;0.25;0.5;0.75;1" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <!-- 车架 -->
      <g stroke="#2b2b33" stroke-width="1.8" stroke-linecap="round">
        <line x1="-22" y1="10" x2="0" y2="10"/>
        <line x1="-22" y1="10" x2="-6" y2="-12"/>
        <line x1="-6" y1="-12" x2="16" y2="-8"/>
        <line x1="16" y1="-8" x2="0" y2="10"/>
        <line x1="16" y1="-8" x2="22" y2="10"/>
        <line x1="16" y1="-8" x2="13" y2="-17"/>
        <path d="M13,-17 q6,-2 8,2" fill="none"/>
        <line x1="-8" y1="-14" x2="-2" y2="-14"/>
      </g>
      <!-- 脚蹬 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 10;360 0 10" dur="0.8s" repeatCount="indefinite"/>
        <line x1="0" y1="10" x2="0" y2="4.5" stroke="#2b2b33" stroke-width="1.4"/>
        <rect x="-2.2" y="3.4" width="4.4" height="1.6" fill="#2b2b33"/>
        <line x1="0" y1="10" x2="0" y2="15.5" stroke="#2b2b33" stroke-width="1.4"/>
        <rect x="-2.2" y="14.9" width="4.4" height="1.6" fill="#2b2b33"/>
      </g>
      <!-- 鹈鹕 -->
      <g stroke="#2b2b33">
        <!-- 近腿（踩踏） -->
        <path fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M-6,-16 L5,-7 L0,4.5 L4.5,5">
          <animate attributeName="d" values="M-6,-16 L5,-7 L0,4.5 L4.5,5;M-6,-16 L7,-5 L5.5,10 L10,10.5;M-6,-16 L5,-4 L0,15.5 L4.5,16;M-6,-16 L6,-6 L-5.5,10 L-1,10.5;M-6,-16 L5,-7 L0,4.5 L4.5,5" keyTimes="0;0.25;0.5;0.75;1" dur="0.8s" repeatCount="indefinite"/>
        </path>
        <!-- 尾羽 -->
        <path d="M-20,-22 l-7,3 M-19,-18 l-7,1" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 身体 -->
        <ellipse cx="-7" cy="-24" rx="14" ry="10" fill="#fdfbf5" stroke-width="1.3"/>
        <!-- 翅膀 -->
        <path d="M-15,-27 C-8,-31 1,-29 6,-23" fill="none" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 脖子与头 -->
        <path d="M4,-30 C6,-34 7,-36 9,-38" fill="none" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="10" cy="-39" r="4.5" fill="#fdfbf5" stroke-width="1.2"/>
        <circle cx="11.5" cy="-40.5" r="0.7" fill="#2b2b33" stroke="none"/>
        <!-- 大嘴与喉囊 -->
        <path d="M13,-41 L34,-35.5 L13.5,-37.5 Z" fill="#2b2b33" stroke="none"/>
        <path d="M13,-37 C16,-30 26,-28.5 33.5,-34.5 C25,-32.5 17,-33.5 13,-35.5 Z" fill="#e9dcb8" stroke-width="1.1"/>
      </g>
    </g>
  </g>

  <!-- 芦苇 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2;2.4;-2" dur="6.5s" repeatCount="indefinite"/>
    <path d="M36,258 C34,236 40,222 36,206" stroke="#2b2b33" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M36,232 q11,-6 15,-17" stroke="#2b2b33" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="2;-2.2;2" dur="7.2s" begin="-1.3s" repeatCount="indefinite"/>
    <path d="M54,258 C54,238 48,226 53,212" stroke="#2b2b33" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M53,236 q-11,-5 -14,-16" stroke="#2b2b33" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.5;2;-1.5" dur="6s" begin="-2.6s" repeatCount="indefinite"/>
    <path d="M22,258 C18,240 26,230 20,218" stroke="#2b2b33" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 落款印章：GLM-5.3-FlashX -->
  <g opacity="0.92">
    <rect x="736" y="210" width="52" height="40" rx="3" fill="#b3352c"/>
    <rect x="738.5" y="212.5" width="47" height="35" rx="2" fill="none" stroke="#f5f0e6" stroke-width="0.9" opacity="0.7"/>
    <text x="762" y="227" text-anchor="middle" font-family="Courier New,monospace" font-weight="bold" font-size="10.5" fill="#f5f0e6">GLM-5.3</text>
    <text x="762" y="242.5" text-anchor="middle" font-family="Courier New,monospace" font-weight="bold" font-size="10.5" fill="#f5f0e6">FlashX</text>
  </g>
</svg>
