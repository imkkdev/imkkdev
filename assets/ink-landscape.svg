<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title description">
  <title id="title">imkkdev · Shanghai After Dark</title>
  <desc id="description">Lee KK's wordmark beside a luminous eclipse over the Shanghai skyline. A pelican cycles along the river. Signed Codex / GPT-6.</desc>
  <style>
    .moving-rider { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      .still-rider { display: none; }
      .moving-rider { display: inline; }
      .corona { animation: breathe 8s ease-in-out infinite alternate; }
      .satellite { animation: orbit 24s linear -4s infinite; }
      .waterlights { animation: shimmer 7s ease-in-out infinite alternate; }
      .spokes { animation: orbit .72s linear infinite; }
    }

    @keyframes breathe { from { opacity: .58; } to { opacity: .93; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes shimmer { from { opacity: .43; } to { opacity: .81; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="21"/></clipPath>
    <clipPath id="river"><rect y="280" width="1200" height="120"/></clipPath>

    <linearGradient id="night" x2="88%" y2="100%">
      <stop stop-color="#090e1e"/>
      <stop offset=".54" stop-color="#11132a"/>
      <stop offset="1" stop-color="#22203c"/>
    </linearGradient>
    <radialGradient id="afterglow">
      <stop stop-color="#f4649e" stop-opacity=".49"/>
      <stop offset=".46" stop-color="#7146bb" stop-opacity=".31"/>
      <stop offset="1" stop-color="#382667" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep-blue">
      <stop stop-color="#194871" stop-opacity=".61"/>
      <stop offset="1" stop-color="#153254" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="760" y1="51" x2="1024" y2="243" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58f6e9"/>
      <stop offset=".28" stop-color="#baf8ff"/>
      <stop offset=".51" stop-color="#8684fa"/>
      <stop offset=".75" stop-color="#f675b3"/>
      <stop offset="1" stop-color="#ffac7e"/>
    </linearGradient>
    <linearGradient id="umbra" x1="26%" y1="12%" x2="74%" y2="100%">
      <stop stop-color="#1d2748"/>
      <stop offset=".54" stop-color="#10132a"/>
      <stop offset="1" stop-color="#322047"/>
    </linearGradient>
    <linearGradient id="orbit-light" x1="-227" y1="0" x2="227" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71e9ed" stop-opacity="0"/>
      <stop offset=".15" stop-color="#71e9ed" stop-opacity=".66"/>
      <stop offset=".49" stop-color="#e2cdff" stop-opacity=".35"/>
      <stop offset=".85" stop-color="#ff998d" stop-opacity=".84"/>
      <stop offset="1" stop-color="#ff998d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge" x2="0" y2="100%">
      <stop stop-color="#5d396b"/>
      <stop offset="1" stop-color="#272643"/>
    </linearGradient>
    <linearGradient id="architecture" x1="678" y1="193" x2="1056" y2="277" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29324d"/>
      <stop offset=".54" stop-color="#232039"/>
      <stop offset="1" stop-color="#0c1729"/>
    </linearGradient>
    <linearGradient id="skyscraper" x2="100%" y2="75%">
      <stop stop-color="#594664"/>
      <stop offset=".47" stop-color="#30243f"/>
      <stop offset="1" stop-color="#182239"/>
    </linearGradient>
    <linearGradient id="river-color" x2="0" y2="100%">
      <stop stop-color="#28223e"/>
      <stop offset=".39" stop-color="#142139"/>
      <stop offset="1" stop-color="#0b1528"/>
    </linearGradient>
    <linearGradient id="reflection" x2="0" y2="100%">
      <stop stop-color="#fff"/>
      <stop offset=".51" stop-color="#fff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waterfront-light" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#436a9d" stop-opacity=".32"/>
      <stop offset=".25" stop-color="#70e9f4" stop-opacity=".84"/>
      <stop offset=".53" stop-color="#59a8e4" stop-opacity=".44"/>
      <stop offset=".8" stop-color="#a197fc" stop-opacity=".62"/>
      <stop offset="1" stop-color="#f5a2bc" stop-opacity=".54"/>
    </linearGradient>
    <linearGradient id="wordmark-light" x2="0" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6fdff"/>
      <stop offset=".53" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#a7c7f8"/>
    </linearGradient>
    <linearGradient id="frame-light" x2="100%" y2="65%">
      <stop stop-color="#538097"/>
      <stop offset=".48" stop-color="#474567"/>
      <stop offset="1" stop-color="#966480"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop stop-color="#e7ffff" stop-opacity=".88"/>
      <stop offset=".3" stop-color="#6df5ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#54eaff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stars" width="172" height="109" patternUnits="userSpaceOnUse">
      <path d="M9 8h1m46 21h1m82-18h1m20 50h1m-64 31h1m-57-18h1m80-8h1M13 49h1"
            fill="none" stroke="#c1c6ea" stroke-opacity=".32" stroke-linecap="round"/>
      <circle cx="81" cy="51" r=".6" fill="#a5f2fa" opacity=".42"/>
      <circle cx="98" cy="13" r=".75" fill="#f0b6d5" opacity=".4"/>
    </pattern>
    <pattern id="ripples" width="223" height="19" patternUnits="userSpaceOnUse">
      <path d="M7 2h35m13 4h57m40-3h48m-85 8h44m15 4h17M0 16h26m24-5h18m-31 6h68"
            fill="none" stroke="#91a2d9" stroke-opacity=".115" stroke-linecap="round"/>
    </pattern>

    <filter id="bloom" x="-.3" y="-.3" width="1.6" height="1.6">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft-reflection" x="-.05" y="-.1" width="1.1" height="1.2">
      <feGaussianBlur stdDeviation="1.7 .35"/>
    </filter>
    <mask id="reflection-fade" maskUnits="userSpaceOnUse" x="0" y="280" width="1200" height="112">
      <rect y="280" width="1200" height="112" fill="url(#reflection)"/>
    </mask>

    <!-- Custom outline lettering stays sharp and consistent in SVG image mode. -->
    <path id="letter-k" d="M0 0h16v32l31-32h21L35 34l36 42H50L24 46l-8 8v22H0Z"/>
    <g id="wordmark">
      <path d="M0 0h42l6 6v8H32v48h16v14H6l-6-6v-8h16V14H0Z"/>
      <path d="M0 76V0h16l25 33L66 0h16v76H66V25L41 56 16 25v51Z" transform="translate(61)"/>
      <use href="#letter-k" x="156"/>
      <use href="#letter-k" x="237"/>
      <path d="M0 0h52l20 19v38L52 76H0Zm17 14v48h29l9-10V24l-9-10Z"
            transform="translate(321)" fill-rule="evenodd"/>
      <path d="M0 0h63v14H16v17h37v14H16v17h47v14H0Z" transform="translate(407)"/>
      <path d="M0 0h17l21 54L59 0h17L46 76H30Z" transform="translate(480)"/>
    </g>

    <path id="waterfront" d="M-72 376C108 346 264 387 437 378S701 345 844 344s250 16 416-22"/>

    <g id="wheel">
      <circle r="10.5" fill="#0c1729" stroke="#9df4f4" stroke-width="1.6"/>
      <path class="spokes" d="M-9 0H9M-4.5-7.8l9 15.6m0-15.6-9 15.6" fill="none"
            stroke="#a5cafa" stroke-opacity=".64" stroke-width=".8"/>
      <circle r="1.5" fill="#e0faff"/>
    </g>
    <g id="pelican">
      <path d="M-76-4h40m-29-4h22m-30 7h40" fill="none" stroke="#7be9fa" stroke-linecap="round"
            stroke-opacity=".27"/>
      <use href="#wheel" x="-22" y="-11"/>
      <use href="#wheel" x="22" y="-11"/>
      <path d="m-22-11 13-17 24 3L0-11h-22m13-17L0-11m22 0-9-21 7-1m-34 3h9"
            fill="none" stroke="#f69cb9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m-9-26 8 8 4 6" fill="none" stroke="#e4c180" stroke-width="2" stroke-linecap="round"/>
      <path d="M-29-33q5 3 11 0c6-4 11-2 17 1q4-3 5-11c1-6 5-9 10-8q7 1 7 6l-4 5q-3 3-4 10
               c-4 7-12 8-20 6q-14-1-22-9Z" fill="#c8f4fb" stroke="#182641" stroke-width="1.4"/>
      <path d="M-21-32q10-2 19 3l-7 2q-6-1-12-5Z" fill="#7ba8ce"/>
      <path d="m18-47 20 5-17 2q-5-1-3-7Z" fill="#ffd092"/>
      <path d="M19-42q8 2 19 0-5 6-12 6-5-1-7-6Z" fill="#ef86a0"/>
      <circle cx="15" cy="-46" r="1.15" fill="#161d32"/>
      <path d="m9-31 7-2" fill="none" stroke="#c8f4fb" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Dusk, behind the orbital rings. -->
    <rect width="1200" height="400" fill="url(#night)"/>
    <ellipse cx="876" cy="218" rx="423" ry="222" fill="url(#afterglow)"/>
    <ellipse cx="192" cy="339" rx="460" ry="225" fill="url(#deep-blue)" opacity=".62"/>
    <rect width="1200" height="280" fill="url(#stars)" opacity=".53"/>
    <g fill="none" stroke="#a29be0" stroke-opacity=".32" stroke-width="1">
      <path d="M670 92h12m-6-6v12m415 35h10m-5-5v10m-66-77h8m-4-4v8M1128 207h7m-3.5-3.5v7"/>
      <path d="M684 56h1m42 58h1m398-43h1m-60 129h1m92-56h1" stroke-width="2" stroke-linecap="round"/>
    </g>
    <ellipse cx="898" cy="151" rx="222" ry="156" fill="none" stroke="#a9a4f4" stroke-opacity=".18"
             stroke-dasharray="1 7" transform="rotate(-17 898 151)"/>
    <g transform="translate(898 151) rotate(-17)" fill="none">
      <path d="M-227 0a227 51 0 0 1 454 0" stroke="url(#orbit-light)" stroke-width="1.1"/>
      <path d="M-247 0a247 58 0 0 1 494 0" stroke="#a9abef" stroke-opacity=".21" stroke-dasharray="1 6"/>
    </g>

    <!-- Eclipse, with its front orbit drawn over the shadow. -->
    <g fill="none">
      <circle cx="898" cy="151" r="137" stroke="url(#spectrum)" stroke-opacity=".3"
              stroke-dasharray="108 32 19 53 157 83 126 283" transform="rotate(-28 898 151)"/>
      <circle cx="898" cy="151" r="127" stroke="url(#spectrum)" stroke-opacity=".37"
              stroke-width="3" stroke-dasharray="1 8.25"/>
      <circle class="corona" cx="898" cy="151" r="116" stroke="url(#spectrum)" stroke-width="16"
              opacity=".76" filter="url(#bloom)"/>
      <circle cx="898" cy="151" r="116" fill="url(#umbra)" stroke="url(#spectrum)" stroke-width="2.4"/>
      <path d="M784 157a114 114 0 0 1 79-114m149 112a114 114 0 0 1-69 101"
            stroke="url(#spectrum)" stroke-opacity=".47" stroke-width="4.8" stroke-linecap="round"/>
      <path d="M798 174a104 104 0 0 0 73 76m23 3a103 103 0 0 0 64-18" stroke="#f29bd3" stroke-opacity=".19"/>
      <path d="M819 89a100 100 0 0 1 92-37m-76 47a83 83 0 0 1 34-23" stroke="#cdfaff" stroke-opacity=".19"/>
      <path d="M794 101a116 116 0 0 1 48-51" stroke="#d6ffff" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M1009 184a116 116 0 0 1-59 71" stroke="#ffd5b0" stroke-width="1.55" stroke-linecap="round"/>
    </g>
    <g transform="translate(898 151) rotate(-17)" fill="none">
      <path d="M227 0a227 51 0 0 1-454 0" stroke="url(#orbit-light)" stroke-width="1.55"/>
      <path d="M247 0a247 58 0 0 1-494 0" stroke="url(#orbit-light)" stroke-opacity=".38" stroke-dasharray="11 7 2 7"/>
    </g>
    <g transform="translate(898 151)">
      <g class="satellite">
        <circle cx="-91" cy="-72" r="15" fill="url(#spark)"/>
        <path d="M-102-72h22m-11-8v16" fill="none" stroke="#abfeff" stroke-opacity=".7"/>
        <circle cx="-91" cy="-72" r="2.5" fill="#f4ffff"/>
      </g>
    </g>
    <circle cx="1053" cy="146" r="2.6" fill="#ffceaf"/>
    <circle cx="1053" cy="146" r="7" fill="none" stroke="#ffbba8" stroke-opacity=".51"/>
    <circle cx="686" cy="224" r="2" fill="#9aebef"/>

    <!-- Shanghai's landmark towers sit in front of the eclipsed skyline. -->
    <path d="M160 280 297 273l62-19 43 7 67-24 39 12 50-13 48 11 73-18 55 15 73-9 54 13
             69-21 45 14 52-23 48 15 65-24 60 20v51Z" fill="url(#ridge)" opacity=".68"/>
    <path d="M398 280l68-19 56-4 53 9 53-14 45 6 60-13 64 11 43-7 45 4 56-10 49 7 79-18 40 6 91-20v62Z"
          fill="#24243e"/>
    <g id="skyline">
      <path d="M536 280v-6h15v-4h35v6h22v-14h19v4h16v-17h10v-6h16v7h11v13h13v-24h16v-6h4v6h12v19h12v-17h9v9h8v16h35
               v-26h12v-4h14v-7h7v8h12v19h21v-13h13v-16h17v6h8v12h16v7h21v-12h11v-11h15v-7h9v8h16v18h14v-27h11v-9h7v9h12v11h14v-4h21v15h13v-19h19v-6h11v7h17v12h14v-2h8v-15h19v8h13v-5h11v11h13v-5h24V280Z"
            fill="url(#architecture)" stroke="#77709a" stroke-opacity=".4"/>

      <!-- Oriental Pearl Tower -->
      <g stroke-linecap="round">
        <path d="M756 174v105m-7-30-9 30m22-30 10 30" fill="none" stroke="#151b33" stroke-width="4"/>
        <path d="M755.5 174v100m-7-23-9 28m23-29 9 29" fill="none" stroke="#b3a7e0" stroke-opacity=".74"/>
        <circle cx="756" cy="211" r="7.2" fill="#423451" stroke="#bea3e4"/>
        <circle cx="756" cy="240" r="12.5" fill="#2c2b46" stroke="#bca3e1"/>
        <path d="M750 209q6 3 12 0m-17 29q11 6 22 0m-17 10q6 2 12 0" fill="none" stroke="#f9b5d1"/>
        <path d="M751 204l3-3h4l3 3z" fill="#aab2dc"/>
        <circle cx="756" cy="174" r="1.6" fill="#fdb8bd"/>
      </g>

      <!-- Jin Mao Tower -->
      <path d="M839 280v-23h4v-13h3v-11h3v-9h3v-9h3v-8h3v-9h2v9h3v8h3v9h3v9h3v11h3v13h4v23Z"
            fill="#2d2946" stroke="#a18abb" stroke-opacity=".82"/>
      <path d="M855 216h8m-11 9h14m-17 9h20m-23 10h26m-29 13h32m-23-21v44m13-44v44"
            fill="none" stroke="#b49bca" stroke-opacity=".57"/>

      <!-- Shanghai World Financial Center -->
      <path d="m885 280 10-96h25l10 96Zm15-90 2 10h11l2-10Z"
            fill="url(#skyscraper)" fill-rule="evenodd" stroke="#ba98c4" stroke-opacity=".78" stroke-linejoin="round"/>
      <path d="m895 277 6-70m17 69-4-69m-17 20h21m-23 13h25m-27 13h30m-31 13h33"
            fill="none" stroke="#c5a3cd" stroke-opacity=".41"/>

      <!-- Shanghai Tower -->
      <path d="m937 280 7-81c1-16 4-33 8-39q4-5 15-2c8 4 9 21 11 41l12 81Z" fill="url(#skyscraper)"
            stroke="#d5adcf" stroke-opacity=".83" stroke-linejoin="round"/>
      <path d="M956 158c12 24 1 49-3 72q-4 22-5 50m13-121c15 30 2 62 0 85l-3 36m-12-96q13 6 30 2m-32 12q14 6 34 3
               m-35 11q13 6 37 3m-38 12q14 6 40 4m-41 12q16 6 43 4m-44 11q20 7 47 4"
            fill="none" stroke="#faafd5" stroke-opacity=".34"/>

      <g fill="none" stroke="#dda2d3" stroke-opacity=".64" stroke-linecap="round">
        <path d="M647 253h18m-18 4h18m26-11h21m-18 6h24m-14 6h13m78-12h19m-21 5h19m-11 5h19m210-13h15m-16 5h19m-10 5h9
                 m25 4h11m8 8h14m26-16h17m-20 5h27m-29 5h16"/>
        <path d="M579 273h10m32-5h6m109 4h11m21-3h18m26 5h15m51-2h8m104-5h16m37-5h17m41 7h29"
              stroke="#8db9f2" stroke-opacity=".71"/>
      </g>
      <path d="M520 279h680" stroke="#d5a4d5" stroke-opacity=".4"/>
    </g>

    <!-- Reflected skyline and light on the Huangpu River. -->
    <rect y="280" width="1200" height="120" fill="url(#river-color)"/>
    <g clip-path="url(#river)">
      <g mask="url(#reflection-fade)" opacity=".78">
        <use href="#skyline" transform="translate(0 560) scale(1 -1)" filter="url(#soft-reflection)"/>
      </g>
      <ellipse cx="860" cy="285" rx="355" ry="49" fill="url(#afterglow)" opacity=".53"/>
      <rect y="281" width="1200" height="116" fill="url(#ripples)"/>
      <path d="M32 323h113m-49 18h153m-74-24h139m31-16h187m-279 69h206m-27-47h86m37 20h103m-27-42h97
               m-64 31h34m-57 24h39m24 23h78m140-51h61m34-23h152m-117 48h108m-194 18h84m-90-52h33"
            fill="none" stroke="#79aadc" stroke-opacity=".23" stroke-linecap="round"/>
      <g class="waterlights" fill="none" stroke-width="1.35" stroke-linecap="round" opacity=".65">
        <path d="M622 281h67m-122 8h58m49 4h88m19-7h54m-109 14h39m41 7h57m-135 11h66m-46 24h41
                 m79-49h53m17-7h63m-62 20h30m-53 8h99m-36 9h27m-94 12h29m85-44h92m-29 13h23m-49 9h84"
              stroke="#eaa7d5" stroke-opacity=".72"/>
        <path d="M219 338h24m77-33h64m87 27h51m64-11h31m39-17h18m123-9h30m46 7h31m75 8h43m19 22h36m41-6h42"
              stroke="#91e9f5" stroke-opacity=".63"/>
      </g>
    </g>

    <!-- Waterfront and the returning rider from the original banner. -->
    <g fill="none" stroke="url(#waterfront-light)">
      <use href="#waterfront" stroke-width="12" opacity=".48" filter="url(#bloom)"/>
      <use href="#waterfront" y="4" stroke-width="4" opacity=".22"/>
      <use href="#waterfront" stroke-width="1.55"/>
      <use href="#waterfront" y="9" stroke-width=".8" stroke-dasharray="30 10 3 10" opacity=".41"/>
    </g>
    <g class="still-rider" transform="translate(431 378) rotate(-3)">
      <use href="#pelican"/>
    </g>
    <g class="moving-rider">
      <animateMotion dur="24s" begin="-9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#waterfront"/>
      </animateMotion>
      <use href="#pelican"/>
    </g>

    <!-- Profile identity -->
    <g transform="translate(64 126)">
      <use href="#wordmark" y="3" fill="#3c69a1" fill-opacity=".37"/>
      <use href="#wordmark" fill="url(#wordmark-light)"/>
    </g>
    <path d="M64 231h21m-1-3 3 3-3 3" fill="none" stroke="#85e5ed" stroke-width="1.4" stroke-linecap="round"/>
    <text x="104" y="237" fill="#b7cbe5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
          font-size="17" font-weight="500" letter-spacing="3.7">LEE KK / SHANGHAI</text>

    <text x="1138" y="379" text-anchor="end" fill="#aebbdc"
          font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
          font-size="18" font-weight="500" letter-spacing="1.6">CODEX / GPT-6</text>

    <path d="M24 39V26h25m1102 0h25v13M24 361v13h25m1102 0h25v-13"
          fill="none" stroke="url(#frame-light)" stroke-opacity=".67"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20.5" fill="none" stroke="url(#frame-light)" stroke-opacity=".82"/>
</svg>
